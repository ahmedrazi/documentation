!Command: show running-config
!Running configuration for switch-core-01
version 9.3(10)
hostname switch-core-01

feature ssh
feature dhcp
feature bgp

password strength-check

username admin password 5 $5$abc$xyzHASHEDvalue role network-admin
username netops password 5 $5$def$anotherHASHED role network-operator

ssh key rsa 2048 force

aaa authentication login default group tacacs+ local
aaa authorization commands default group tacacs+ local
aaa accounting default group tacacs+ local

banner motd #Authorized access only. Activity is monitored.#

copp profile strict
spanning-tree port type edge bpduguard default

ip dhcp snooping

ip access-list MGMT-IN
  10 permit tcp 10.0.0.0/24 any eq 22
  20 deny ip any any log

snmp-server user snmpadmin auth sha AuthKey12345 priv aes-128 PrivKey12345

ntp server 10.0.0.10 use-vrf management
ntp authenticate
clock timezone UTC 0 0

logging server 10.0.0.20 5 use-vrf management
logging timestamp milliseconds
logging console 3
logging level aaa 5

interface Ethernet1/1
  description uplink-to-agg
  no ip redirects
  no ip proxy-arp
  no switchport
  ip address 10.1.1.1/30

interface Ethernet1/2
  description server-facing
  no ip redirects
  no ip proxy-arp
  switchport
  switchport mode access

interface Ethernet1/45
  description unused
  shutdown

interface Ethernet1/46
  description unused
  shutdown

interface Ethernet1/47
  description unused
  shutdown

interface Ethernet1/48
  description unused
  shutdown

router bgp 65001
  router-id 10.1.1.1
  neighbor 10.1.1.2 remote-as 65002
  neighbor 10.1.1.2 password 7 encryptedBGPkey

line console
  exec-timeout 10 0

line vty
  exec-timeout 10 0
  access-class MGMT-IN in
  transport input ssh
