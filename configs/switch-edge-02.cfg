!Command: show running-config
!Running configuration for switch-edge-02
version 9.3(10)
hostname switch-edge-02

feature telnet
feature ssh

username admin password 0 Cisco123 role network-admin
username guest password 0 guest role network-operator

ssh key rsa 1024 force

snmp-server community public ro
snmp-server community private rw

ip source-route

interface Ethernet1/1
  description uplink
  ip redirects
  ip proxy-arp
  no switchport
  ip address 192.168.1.1/24

interface Ethernet1/2
  description user-port
  ip redirects
  switchport
  switchport mode access

interface Ethernet1/45
  description unused-but-live

interface Ethernet1/46
  description unused-but-live

router bgp 65010
  router-id 192.168.1.1
  neighbor 192.168.1.2 remote-as 65020

line console
  exec-timeout 0 0

line vty
  transport input telnet ssh
