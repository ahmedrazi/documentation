# =============================================================================
# inputs.conf  -- monitor the compliance NDJSON output
# =============================================================================
# Deploy to: $SPLUNK_HOME/etc/system/local/inputs.conf  (single box), or to a
# Universal Forwarder that ships to the indexer.
#
# On the single Linux box, the checker writes NDJSON into /opt/nxos-compliance/
# output (see docker-compose.yml / setup.sh). Point Splunk at that path.
# =============================================================================

[monitor:///opt/nxos-compliance/output/*.ndjson]
disabled = false
sourcetype = nxos_compliance
index = dcn-compliance
# The scan overwrites the file each run; re-index the whole file on change.
crcSalt = <SOURCE>
followTail = 0
