# =============================================================================
# props.conf  -- NX-OS compliance NDJSON sourcetype
# =============================================================================
# Deploy to: $SPLUNK_HOME/etc/system/local/props.conf   (single box)
#        or: the app that owns the inputs (e.g. TA-nxos-compliance)
#
# The checker emits newline-delimited JSON: one complete JSON object per line,
# one event per line. These settings tell Splunk to treat each line as its own
# event and to parse the JSON fields automatically.
# =============================================================================

[nxos_compliance]
# Each line is one full event -- never merge lines together.
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
# Auto-extract JSON key/values at search time.
KV_MODE = json
# Pull the event timestamp from the JSON, not the file mtime.
TIME_PREFIX = "scanned_at":\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%z
MAX_TIMESTAMP_LOOKAHEAD = 40
# Trust the per-event timestamp above.
TRUNCATE = 100000
# Friendly field aliases / category for reporting.
category = Network Security Compliance
